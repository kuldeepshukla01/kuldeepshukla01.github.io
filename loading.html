<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kuldeep Shukla — Cybersecurity Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    @property --t { syntax: "<number>"; inherits: false; initial-value: 0; }
    @property --m { syntax: "<number>"; inherits: false; initial-value: 1; }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #18191d 0%, #0d0e12 45%, #000000 85%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Atmospheric ambient lighting & vignette */
    .bg-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.82) 100%);
      z-index: 5;
    }

    .bg-noise {
      position: absolute;
      inset: 0;
      opacity: 0.025;
      pointer-events: none;
      background-image: radial-gradient(#ffffff 1px, transparent 1px);
      background-size: 24px 24px;
      z-index: 4;
    }

    /* Top Navigation Bar: Brand & Dublin Location on Left, Actions on Right (No Overlap!) */
    header.top-nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1.8rem 2.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 40;
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: auto;
    }

    @media (max-width: 768px) {
      header.top-nav {
        padding: 1.2rem 1.4rem;
      }
    }

    .nav-brand-group {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .nav-brand {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 12px #38bdf8, 0 0 20px rgba(56, 189, 248, 0.5);
      animation: pulseDot 2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    .nav-divider {
      color: rgba(255, 255, 255, 0.2);
      font-weight: 300;
      font-size: 0.9rem;
    }

    .nav-location {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: #38bdf8;
      text-transform: uppercase;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.22);
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
    }

    @media (max-width: 600px) {
      .nav-divider, .nav-location {
        display: none;
      }
    }

    /* Top Actions Dock (Replay & Enter Portfolio) cleanly on top right */
    .top-actions-dock {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .btn-action-glass {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #cbd5e1;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.45rem 0.95rem;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-action-glass:hover {
      color: #ffffff;
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(30, 41, 59, 0.9);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
    }

    .btn-enter-portfolio {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.24), rgba(129, 140, 248, 0.24));
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #38bdf8;
    }

    .btn-enter-portfolio:hover {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.42), rgba(129, 140, 248, 0.42));
      color: #ffffff;
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.45);
    }

    /* WebGL Particle Canvas */
    #gl-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 15;
      pointer-events: auto;
    }

    /* Hidden portrait image reference for bounding rect */
    .portrait-anchor-wrap {
      position: absolute;
      inset-inline: 0;
      top: 6vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    @media (max-width: 768px) {
      .portrait-anchor-wrap {
        top: 16vh;
      }
    }

    #portrait-anchor {
      visibility: hidden;
      width: auto;
      max-width: none;
      height: 120vh;
      object-fit: contain;
    }

    @media (max-width: 768px) {
      #portrait-anchor {
        height: 85vh;
      }
    }

    /* Main Big Hero Typography Container */
    .hero-title-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 25;
      pointer-events: none;
      width: max-content;
      text-align: center;
    }

    .title-motion-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: max-content;
      will-change: transform;
    }

    .hero-text {
      display: flex;
      align-items: baseline;
      justify-content: center;
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: clamp(3.2rem, 13vw, 12rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.9;
      text-transform: uppercase;
      filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.85));
      background: linear-gradient(180deg, #ffffff 0%, #d8e2ec 40%, #8899ac 72%, #2d3748 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      user-select: none;
      white-space: nowrap;
    }

    .part-left, .part-right {
      display: inline-block;
      will-change: transform;
    }

    /* Initial Bouncing Ball & Name Reveal Stage */
    .initial-letters-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: max-content;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 28;
    }

    .bouncing-ball {
      position: absolute;
      width: 20px;
      height: 20px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.95), 0 0 45px rgba(56, 189, 248, 0.85);
      opacity: 0;
      pointer-events: none;
      z-index: 35;
      will-change: transform, opacity;
    }

    .ball-impact-wave {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.85);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.7);
      opacity: 0;
      pointer-events: none;
      transform: scale(0.2);
    }

    .name-display-box {
      display: flex;
      align-items: baseline;
      justify-content: center;
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: clamp(2.4rem, 9.5vw, 8.8rem);
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 0.92;
      text-transform: uppercase;
      filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.85));
      background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 42%, #94a3b8 74%, #334155 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .name-char {
      display: inline-block;
      opacity: 0;
      transform: translateY(18px) scale(0.88);
      will-change: transform, opacity;
    }

    /* TASK 1: SIDE INFORMATION CARD (ON THE SIDE, NOT ON PICTURE) */
    .side-credentials-panel {
      position: absolute;
      bottom: 2.2rem;
      left: 2.8rem;
      max-width: 460px;
      z-index: 35;
      opacity: 0;
      transform: translateY(20px);
      pointer-events: auto;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (max-width: 900px) {
      .side-credentials-panel {
        bottom: 5.5rem;
        left: 1.4rem;
        max-width: calc(100vw - 2.8rem);
      }
    }

    .side-pill-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.55rem;
    }

    .side-pill-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 0.26rem 0.65rem;
      border-radius: 9999px;
    }

    .side-pill-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 6px #38bdf8;
    }

    .side-main-role {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: clamp(1.15rem, 2vw, 1.75rem);
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 0.55rem;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
    }

    .side-badges-flow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
    }

    .side-badge-item {
      font-family: 'Inter', sans-serif;
      font-size: 0.76rem;
      font-weight: 500;
      color: #cbd5e1;
      background: rgba(18, 22, 32, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0.32rem 0.72rem;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.3s ease;
    }

    .side-badge-item:hover {
      border-color: rgba(56, 189, 248, 0.45);
      color: #ffffff;
      background: rgba(30, 41, 59, 0.8);
    }

    .side-badge-item .badge-accent {
      color: #38bdf8;
      font-weight: 700;
    }

    /* TASK 3: OPTIMIZED CORNER CONTACT DOCK (INWARD SPLAY SO NEVER CUT OFF!) */
    .corner-contact-dock {
      position: absolute;
      bottom: 2.2rem;
      right: 2.5rem;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (max-width: 768px) {
      .corner-contact-dock {
        bottom: 1.4rem;
        right: 1.4rem;
      }
    }

    /* Core Contact Trigger Button */
    .core-contact-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.72rem 1.5rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(15, 20, 30, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #f1f5f9;
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      overflow: hidden;
      z-index: 20;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 25px rgba(56, 189, 248, 0.2);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .core-contact-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.6);
      background: rgba(22, 28, 42, 0.9);
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.8), 0 0 30px rgba(56, 189, 248, 0.4);
    }

    .core-contact-btn:active {
      transform: translateY(0) scale(0.97);
    }

    .core-contact-icon {
      width: 15px;
      height: 15px;
      color: #38bdf8;
      transition: transform 0.3s cubic-bezier(0.3, 1.35, .5, 1);
    }

    .corner-contact-dock.open .core-contact-icon {
      transform: rotate(45deg);
      color: #f43f5e;
    }

    .corner-contact-dock.open .core-contact-btn {
      border-color: rgba(244, 63, 94, 0.5);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 25px rgba(244, 63, 94, 0.3);
    }

    /* SPLAY MATH: Fans inward into screen (UP & LEFT) so Download & Copy never cut off! */
    .contact-splay {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 10;
    }

    .contact-chip {
      --d: 46px;
      --r: 108px;
      /* Angles from -100deg (up) to -172deg (left) -> strictly moves into viewport! */
      --base-angle: -100deg;
      --pitch: 18deg;
      --a: calc(var(--base-angle) - (var(--i) - 1) * var(--pitch));
      position: absolute;
      left: 0;
      top: 0;
      width: var(--d);
      height: var(--d);
      margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
      border: 0;
      padding: 0;
      background: none;
      cursor: pointer;
      z-index: 15;
      pointer-events: none;
      transform: translate(calc(cos(var(--a)) * var(--r) * var(--t) * var(--m)), calc(sin(var(--a)) * var(--r) * var(--t) * var(--m))) scale(var(--t));
      opacity: calc(var(--t) * 1.5);
      transition: --t .4s cubic-bezier(.3, 1.35, .5, 1) calc(var(--i) * 30ms), --m .45s cubic-bezier(.6, 0, .2, 1), opacity .25s;
    }

    @media (max-width: 768px) {
      .contact-chip {
        --d: 42px;
        --r: 96px;
        --base-angle: -95deg;
        --pitch: 19deg;
      }
    }

    .corner-contact-dock.open .contact-chip {
      --t: 1;
      pointer-events: auto;
    }

    .chip-body {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      background: #11151e;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7), 0 0 16px rgba(0, 0, 0, 0.5);
      display: grid;
      place-items: center;
      transition: all 0.28s ease;
    }

    .contact-chip:hover .chip-body {
      transform: scale(1.15);
      border-color: var(--c);
      box-shadow: 0 0 22px var(--c);
    }

    .chip-flood {
      position: absolute;
      inset: 0;
      background: var(--c);
      clip-path: circle(0% at var(--fx, 50%) var(--fy, 50%));
      transition: clip-path 0.4s ease;
      border-radius: 50%;
    }

    .contact-chip:hover .chip-flood {
      clip-path: circle(150% at var(--fx, 50%) var(--fy, 50%));
    }

    .chip-icon {
      position: relative;
      z-index: 2;
      width: 19px;
      height: 19px;
      fill: currentColor;
      color: var(--c);
      transition: color 0.25s ease;
    }

    .contact-chip:hover .chip-icon {
      color: #ffffff;
    }

    /* Tooltip placed inward to the LEFT of chip so it never gets cut off */
    .chip-tooltip {
      position: absolute;
      right: calc(100% + 8px);
      top: 50%;
      transform: translateY(-50%) translateX(4px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.32rem 0.65rem;
      border-radius: 5px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    }

    .contact-chip:hover .chip-tooltip {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }

    /* Toast Notification */
    .toast-notice {
      position: fixed;
      top: 5rem;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(16, 185, 129, 0.92);
      border: 1px solid #10b981;
      color: #ffffff;
      padding: 0.55rem 1.4rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 20px rgba(16, 185, 129, 0.4);
    }

    .toast-notice.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div id="app">
  <div class="bg-vignette"></div>
  <div class="bg-noise"></div>

  <!-- Toast Notice -->
  <div class="toast-notice" id="toastNotice">Link Copied to Clipboard!</div>

  <!-- Top Navigation Header: Brand & Dublin Location on Left, Actions on Right (No Overlap!) -->
  <header class="top-nav" id="topNav">
    <div class="nav-brand-group">
      <div class="nav-brand">
        <div class="brand-dot"></div>
        <span>KULDEEP SHUKLA</span>
      </div>
      <span class="nav-divider">/</span>
      <span class="nav-location">DUBLIN, IRELAND</span>
    </div>

    <!-- Top Action Buttons (Replay & Enter Portfolio) -->
    <div class="top-actions-dock" id="topActionsDock">
      <button class="btn-action-glass" id="replayBtn" title="Replay Animation">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span>Replay</span>
      </button>
      <a href="index.html" class="btn-action-glass btn-enter-portfolio">
        <span>Enter Portfolio</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>
  </header>

  <!-- WebGL2 Particle Rendering Canvas -->
  <canvas id="gl-canvas"></canvas>

  <!-- Reference Image for Canvas Anchor Position -->
  <div class="portrait-anchor-wrap">
    <img id="portrait-anchor" src="assets/kuldeep_portrait.png" alt="Portrait Reference" />
  </div>

  <!-- Main Big Hero Title & Split PORTFOLIO Stage -->
  <div class="hero-title-container" id="heroTitleContainer">
    <div class="title-motion-wrapper" id="titleWrapper">
      
      <!-- Split PORTFOLIO Text -->
      <h1 class="hero-text" id="mainHeroText" style="opacity: 0;">
        <span class="part-left" id="partLeft">PORT</span>
        <span class="part-right" id="partRight">FOLIO</span>
      </h1>

    </div>
  </div>

  <!-- Bouncing Light & Name Animation Overlay Stage -->
  <div class="initial-letters-box" id="initialLettersBox">
    <div class="bouncing-ball" id="bouncingBall"></div>
    <div class="ball-impact-wave" id="ballWave"></div>
    <div class="name-display-box" id="nameDisplayBox"></div>
  </div>

  <!-- TASK 1: SIDE INFORMATION PANEL (ON THE SIDE, NOT ON PICTURE) -->
  <div class="side-credentials-panel" id="sidePanel">
    <div class="side-pill-header">
      <div class="side-pill-tag">
        <div class="side-pill-dot"></div>
        <span>PORTFOLIO VERIFIED</span>
      </div>
    </div>
    <div class="side-main-role">
      Aspiring Cybersecurity Analyst
    </div>
    <div class="side-badges-flow">
      <div class="side-badge-item">
        <span class="badge-accent">🛡️</span>
        <span>Ethical Hacker (Cisco)</span>
      </div>
      <div class="side-badge-item">
        <span class="badge-accent">🔍</span>
        <span>Android Bug Bounty</span>
      </div>
      <div class="side-badge-item">
        <span class="badge-accent">⚡</span>
        <span>NIDS Builder</span>
      </div>
      <div class="side-badge-item">
        <span class="badge-accent">🎓</span>
        <span>BSc Computing & IT, CCT Dublin</span>
      </div>
    </div>

  const TARGET_WORD = "PORTFOLIO";

  // Elements
  const app = document.getElementById("app");
  const topNav = document.getElementById("topNav");
  const topActionsDock = document.getElementById("topActionsDock");
  const canvas = document.getElementById("gl-canvas");
  const portraitAnchor = document.getElementById("portrait-anchor");
  const titleWrapper = document.getElementById("titleWrapper");
  const mainHeroText = document.getElementById("mainHeroText");
  const partLeft = document.getElementById("partLeft");
  const partRight = document.getElementById("partRight");
  const initialLettersBox = document.getElementById("initialLettersBox");
  const bouncingBall = document.getElementById("bouncingBall");
  const ballWave = document.getElementById("ballWave");
  const nameDisplayBox = document.getElementById("nameDisplayBox");
  const sidePanel = document.getElementById("sidePanel");
  const contactDock = document.getElementById("contactDock");
  const contactToggleBtn = document.getElementById("contactToggleBtn");
  const contactBtnText = document.getElementById("contactBtnText");
  const toastNotice = document.getElementById("toastNotice");
  const replayBtn = document.getElementById("replayBtn");

  // Contact Links from Portfolio
  const CONTACT_LINKS = {
    linkedin: "https://www.linkedin.com/in/1daycrew",
    email: "mailto:kuldeepshuklan@outlook.com",
    github: "https://github.com/kuldeepshukla01",
    cv: "assets/Kuldeep_Shukla_CV.pdf",
    copy: window.location.href
  };

  // WebGL Shaders
  const VS_SOURCE = `#version 300 es
  precision highp float;

  in vec2 aHome;   // 0..1 inside the anchor rect
  in vec3 aAir;    // x,y 0..1 over the canvas, z = depth (0 near, 1 far)
  in vec4 aInfo;   // brightness, delay, duration, phase
  in vec3 aCell;   // atlas window origin (uv), kind (0 tile, 1 dust)

  uniform vec2 uRes;       // canvas, CSS px
  uniform vec4 uRect;      // anchor x, y, w, h in canvas CSS px
  uniform float uCell;     // tile pitch, CSS px
  uniform float uDpr;
  uniform float uTime;     // seconds, always running
  uniform float uReveal;   // seconds since play
  uniform float uScatter;  // 0 = face, 1 = blown back into the air
  uniform vec2 uMouse;     // CSS px, far away when absent

  out vec2 vCell;
  out float vBright;
  out float vLand;
  out float vAlpha;
  out float vPhase;

  float inOut(float t) { return t < 0.5 ? 4.0*t*t*t : 1.0 - pow(-2.0*t + 2.0, 3.0) / 2.0; }

  void main() {
    float bright = aInfo.x;
    float delay  = aInfo.y;
    float dur    = aInfo.z;
    float phase  = aInfo.w;
    float depth  = aAir.z;
    bool dust    = aCell.z > 0.5;

    // Air position: slow organic drift in deep space
    vec2 drift = vec2(sin(uTime*0.31 + phase*6.283), cos(uTime*0.23 + phase*9.1))
               * (6.0 + 22.0*(1.0 - depth));
    vec2 air  = aAir.xy * uRes + drift;
    vec2 home = uRect.xy + aHome * uRect.zw;

    // Reveal: fast snappy arrival
    float appear = smoothstep(0.0, 0.45, uReveal - delay*0.22);
    float fly    = dust ? 0.0 : clamp((uReveal - delay*0.65) / (dur * 0.75), 0.0, 1.0);
    float e      = inOut(fly);

    // Scatter
    float q = clamp(uScatter*1.7 - phase*0.7, 0.0, 1.0);
    q = q*q;

    float k = e * (1.0 - q);              // 1 = sitting in the face
    vec2 pos = mix(air, home, k);

    // Curved gathering arc
    vec2 d = home - air;
    pos += vec2(-d.y, d.x) * 0.18 * sin(3.14159*k) * (phase - 0.5);

    // Pointer repulsion
    vec2 m = pos - uMouse;
    float ml = length(m);
    pos += (ml > 0.001 ? m/ml : vec2(0.0)) * smoothstep(120.0, 0.0, ml) * 18.0 * k;

    float land  = smoothstep(0.55, 1.0, k);
    float speck = mix(2.2, 0.9, depth);
    float tile  = uCell * (0.25 + 0.7*bright);
    float size  = mix(speck, tile, land);

    float dustA = dust ? mix(0.55, 0.22, smoothstep(1.5, 3.0, uReveal)) : 1.0;
    vAlpha  = appear * mix(0.25 + 0.55*(1.0 - depth), 1.0, land) * dustA;
    vBright = bright;
    vLand   = land;
    vCell   = aCell.xy;
    vPhase  = phase;

    vec2 clip = pos / uRes * 2.0 - 1.0;
    gl_Position  = vec4(clip.x, -clip.y, 0.0, 1.0);
    gl_PointSize = max(size * uDpr, 1.0);
  }
  `;

  const FS_SOURCE = `#version 300 es
  precision highp float;

  uniform sampler2D uAtlas;
  uniform vec2 uWin;     // window size in atlas uv
  uniform float uTime;

  in vec2 vCell;
  in float vBright;
  in float vLand;
  in float vAlpha;
  in float vPhase;
  out vec4 outColor;

  void main() {
    vec3 c = texture(uAtlas, vCell + gl_PointCoord * uWin).rgb;
    float peak = max(max(c.r, c.g), max(c.b, 0.06));
    vec3 hue = c / peak;
    vec3 tile = mix(hue, min(c * 1.8, 1.0), 0.35);
    tile = mix(tile, vec3(1.0), 0.15);
    float twinkle = 0.9 + 0.1*sin(uTime*1.6 + vPhase*47.0);
    tile *= (0.1 + 0.95*vBright) * twinkle;

    vec3 speck = vec3(0.9, 0.92, 1.0);
    vec3 rgb = mix(speck, tile, vLand);
    outColor = vec4(rgb * vAlpha, vAlpha);
  }
  `;

  // Atlas & Particle Constants
  const ATLAS_W = 1024;
  const ATLAS_H = 640;
  const CELL_PX = 56;
  const DUST_RATIO = 0.07;
  const getPitch = w => Math.min(4.5, Math.max(3.0, w / 220));

  let gl, program, vao, buffers = [];
  let uLocs = {};
  let portraitImg = null;
  let atlasTexture = null;
  let particleCount = 0;
  let cellPitch = 3.5;
  let animStartTime = null;
  let revealTime = null;
  let cachedAnchorWidth = -1;
  let mouse = { x: -9999, y: -9999, tx: -9999, ty: -9999 };

  function smoothstep(minVal, maxVal, value) {
    let x = Math.max(0, Math.min(1, (value - minVal) / (maxVal - minVal)));
    return x * x * (3 - 2 * x);
  }

  // Build Particle Data Buffers from portrait
  function buildParticleData(img, targetWidth) {
    const pitch = getPitch(targetWidth);
    const cols = Math.max(20, Math.round(targetWidth / pitch));
    const rows = Math.round(cols * img.naturalHeight / img.naturalWidth);

    const c = document.createElement("canvas");
    c.width = cols;
    c.height = rows;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, 0, 0, cols, rows);
    const data = ctx.getImageData(0, 0, cols, rows).data;

    const home = [];
    const air = [];
    const info = [];
    const cellAttr = [];
    const winU = CELL_PX / ATLAS_W;
    const winV = CELL_PX / ATLAS_H;
    let maxSettle = 0;

    const addParticle = (hx, hy, bright, isDust) => {
      home.push(hx, hy);
      air.push(Math.random() * 1.2 - 0.1, Math.random() * 1.2 - 0.1, Math.random());
      const delay = 0.2 + Math.random() * 0.6 + hy * 0.3;
      const dur = 0.95 + Math.random() * 0.45;
      if (!isDust) maxSettle = Math.max(maxSettle, delay + dur);
      info.push(bright, delay, dur, Math.random());
      cellAttr.push(Math.random() * (1 - winU), Math.random() * (1 - winV), isDust ? 1.0 : 0.0);
    };

    const lumArray = new Float32Array(cols * rows);
    for (let i = 0; i < cols * rows; i++) {
      const idx = i * 4;
      lumArray[i] = (0.2126 * data[idx] + 0.7152 * data[idx+1] + 0.0722 * data[idx+2]) / 255 * (data[idx+3] / 255);
    }

    const validLums = Array.from(lumArray).filter(v => v >= 0.035).sort((a, b) => a - b);
    const low = validLums[Math.floor(validLums.length * 0.02)] || 0;
    const high = validLums[Math.floor(validLums.length * 0.97)] || 1;

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const l = lumArray[y * cols + x];
        if (l < 0.035 || (l < 0.08 && Math.random() < 0.45)) continue;
        const norm = Math.min(1, Math.max(0, (l - low) / (high - low)));
        const bright = 0.2 * norm + 0.8 * smoothstep(0.1, 0.55, norm);
        addParticle((x + 0.5) / cols, (y + 0.5) / rows, bright, false);
      }
    }

    const subCount = home.length / 2;
    for (let i = 0; i < Math.round(subCount * DUST_RATIO); i++) {
      addParticle(0.5, 0.5, 0.3, true);
    }

    return {
      count: home.length / 2,
      cellPitch: pitch,
      settle: maxSettle,
      home: new Float32Array(home),
      air: new Float32Array(air),
      info: new Float32Array(info),
      cellAttr: new Float32Array(cellAttr)
    };
  }

  // Initialize WebGL2
  function initWebGL() {
    gl = canvas.getContext("webgl2", { alpha: true, premultipliedAlpha: true, antialias: false });
    if (!gl) {
      console.warn("WebGL2 not supported, fallback to image");
      portraitAnchor.style.visibility = "visible";
      return false;
    }

    const compileShader = (src, type) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(s));
      }
      return s;
    };

    program = gl.createProgram();
    gl.attachShader(program, compileShader(VS_SOURCE, gl.VERTEX_SHADER));
    gl.attachShader(program, compileShader(FS_SOURCE, gl.FRAGMENT_SHADER));
    gl.linkProgram(program);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program));
    }

    gl.useProgram(program);

    const getU = name => gl.getUniformLocation(program, name);
    uLocs = {
      res: getU("uRes"),
      rect: getU("uRect"),
      cell: getU("uCell"),
      dpr: getU("uDpr"),
      time: getU("uTime"),
      reveal: getU("uReveal"),
      scatter: getU("uScatter"),
      mouse: getU("uMouse"),
      atlas: getU("uAtlas"),
      win: getU("uWin")
    };

    vao = gl.createVertexArray();
    gl.bindVertexArray(vao);

    buffers = ["aHome", "aAir", "aInfo", "aCell"].map((attr, idx) => {
      const buf = gl.createBuffer();
      const loc = gl.getAttribLocation(program, attr);
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, [2, 3, 4, 3][idx], gl.FLOAT, false, 0, 0);
      return buf;
    });

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.uniform2f(uLocs.win, CELL_PX / ATLAS_W, CELL_PX / ATLAS_H);

    animStartTime = performance.now() / 1000;
    return true;
  }

  function updateParticleBuffers() {
    if (!portraitImg || !gl) return;
    const anchorRect = portraitAnchor.getBoundingClientRect();
    const w = anchorRect.width;
    if (w < 10 || Math.abs(w - cachedAnchorWidth) < 1) return;
    cachedAnchorWidth = w;

    const data = buildParticleData(portraitImg, w);
    particleCount = data.count;
    cellPitch = data.cellPitch;

    [data.home, data.air, data.info, data.cellAttr].forEach((arr, idx) => {
      gl.bindBuffer(gl.ARRAY_BUFFER, buffers[idx]);
      gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
    });
  }

  function renderFrame() {
    if (!gl || particleCount === 0 || revealTime === null) {
      requestAnimationFrame(renderFrame);
      return;
    }

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    const w = Math.round(rect.width * dpr);
    const h = Math.round(rect.height * dpr);

    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      updateParticleBuffers();
    }

    const now = performance.now() / 1000;
    mouse.x += (mouse.tx - mouse.x) * 0.18;
    mouse.y += (mouse.ty - mouse.y) * 0.18;

    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    const anchorRect = portraitAnchor.getBoundingClientRect();
    gl.uniform2f(uLocs.res, rect.width, rect.height);
    gl.uniform4f(uLocs.rect, anchorRect.left - rect.left, anchorRect.top - rect.top, anchorRect.width, anchorRect.height);
    gl.uniform1f(uLocs.cell, cellPitch);
    gl.uniform1f(uLocs.dpr, dpr);
    gl.uniform1f(uLocs.time, now - animStartTime);
    gl.uniform1f(uLocs.reveal, now - revealTime);
    gl.uniform1f(uLocs.scatter, 0.0);
    gl.uniform2f(uLocs.mouse, mouse.x, mouse.y);

    gl.drawArrays(gl.POINTS, 0, particleCount);
    requestAnimationFrame(renderFrame);
  }

  // Pointer Repulsion Listeners
  window.addEventListener("pointermove", e => {
    const r = canvas.getBoundingClientRect();
    mouse.tx = e.clientX - r.left;
    mouse.ty = e.clientY - r.top;
    if (mouse.x < -999) {
      mouse.x = mouse.tx;
      mouse.y = mouse.ty;
    }
  }, { passive: true });

  document.addEventListener("pointerleave", () => {
    mouse.tx = -9999;
    mouse.ty = -9999;
    mouse.x = -9999;
    mouse.y = -9999;
  });

  window.addEventListener("resize", () => {
    cachedAnchorWidth = -1;
    updateParticleBuffers();
  });

  function loadAssets() {
    return new Promise(resolve => {
      const loadImg = (url, fallbackUrl) => new Promise(res => {
        const i = new Image();
        i.decoding = "async";
        i.onload = () => res(i);
        i.onerror = () => {
          if (fallbackUrl && i.src !== fallbackUrl) {
            i.src = fallbackUrl;
          } else {
            res(i);
          }
        };
        i.src = url;
      });

      Promise.all([
        loadImg("assets/kuldeep_portrait.png", window.PORTRAIT_DATA_URL),
        loadImg("assets/cyber_assets/mosaic_atlas.jpg", window.ATLAS_DATA_URL)
      ]).then(([pImg, aImg]) => {
        portraitImg = pImg;
        if (gl) {
          atlasTexture = gl.createTexture();
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, atlasTexture);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, aImg);
          gl.generateMipmap(gl.TEXTURE_2D);
          gl.uniform1i(uLocs.atlas, 0);
          updateParticleBuffers();
        }
        resolve();
      });
    });
  }

  // TASK 2: FAST, SNAPPY BOUNCE & IMMEDIATE NAME WRITING
  function playBounceAndWriteName(onComplete) {
    nameDisplayBox.innerHTML = "";
    const chars = Array.from(FULL_NAME);
    const charSpans = chars.map(ch => {
      const span = document.createElement("span");
      span.className = "name-char";
      span.innerHTML = ch === " " ? "&nbsp;" : ch;
      nameDisplayBox.appendChild(span);
      return span;
    });

    const ball = bouncingBall;
    const wave = ballWave;

    gsap.set(charSpans, { opacity: 0, y: 16, scale: 0.9 });
    gsap.set(ball, { opacity: 1, y: -190, scaleX: 1, scaleY: 1 });
    gsap.set(wave, { opacity: 0, scale: 0.2 });

    const tl = gsap.timeline();

    // 1. Snappy Ball fall (0.32s)
    tl.to(ball, {
      y: 0,
      duration: 0.32,
      ease: "power2.in"
    })
    // Impact squash
    .to(ball, {
      scaleX: 1.55,
      scaleY: 0.45,
      duration: 0.04,
      ease: "none"
    })
    // Rebound jump
    .to(ball, {
      y: -28,
      scaleX: 0.88,
      scaleY: 1.15,
      duration: 0.14,
      ease: "power1.out"
    })
    // Quick landing
    .to(ball, {
      y: 0,
      scaleX: 1.3,
      scaleY: 0.65,
      duration: 0.1,
      ease: "power2.in"
    })
    // Impact wave ripple
    .to(wave, {
      opacity: 0.95,
      scale: 1.6,
      duration: 0.2,
      ease: "power1.out"
    }, "<")
    .to(wave, {
      opacity: 0,
      scale: 2.5,
      duration: 0.22,
      ease: "power2.out"
    }, "-=0.08")
    // Ball fades into flare
    .to(ball, {
      scale: 2.2,
      opacity: 0,
      duration: 0.16,
      ease: "power2.out"
    }, "<");

    // 2. Fast energetic write out of KULDEEP SHUKLA (0.28s total)
    tl.to(charSpans, {
      opacity: 1,
      y: 0,
      scale: 1,
      duration: 0.26,
      stagger: 0.022,
      ease: "back.out(1.4)"
    }, "-=0.12");

    // Brief crisp hold (0.28s) so the name is clearly seen
    tl.to({}, { duration: 0.28 });

    tl.call(() => {
      if (onComplete) onComplete();
    });

    return tl;
  }

  // TASK 2: FAST HIGH-TECH MORPH INTO PORTFOLIO (0.55s total)
  function playMorphAnimation(onComplete) {
    const duration = 0.55;
    const startTime = performance.now();
    const glyphs = "01#_X$*!~<>/";

    mainHeroText.style.opacity = "1";
    initialLettersBox.style.opacity = "0";

    const getMorphed = (progress) => {
      const lockedCount = Math.round(progress * TARGET_WORD.length);
      return TARGET_WORD.split("").map((targetChar, idx) => {
        if (idx < lockedCount) {
          return targetChar;
        } else if (idx < FULL_NAME.length) {
          if (progress > 0.1 && Math.random() < 0.3) {
            return glyphs[Math.floor(Math.random() * glyphs.length)];
          }
          return FULL_NAME[idx] === " " ? "_" : FULL_NAME[idx];
        } else {
          return Math.random() < 0.3 ? glyphs[Math.floor(Math.random() * glyphs.length)] : "";
        }
      }).join("");
    };

    const frame = now => {
      const elapsed = (now - startTime) / 1000;
      const progress = Math.min(elapsed / duration, 1);
      const text = getMorphed(progress);

      partLeft.textContent = text.slice(0, 4);
      partRight.textContent = text.slice(4);

      if (progress < 1) {
        requestAnimationFrame(frame);
      } else {
        partLeft.textContent = "PORT";
        partRight.textContent = "FOLIO";
        if (onComplete) onComplete();
      }
    };

    requestAnimationFrame(frame);
  }

  // Grand Split & Immediate Particle Gathering
  function playSplitAndReveal() {
    const isMobile = window.innerWidth < 768;
    const liftY = isMobile ? -window.innerHeight * 0.15 : -window.innerHeight * 0.22;
    const gapX = isMobile ? window.innerWidth * 0.22 : window.innerWidth * 0.17;

    // Immediately trigger WebGL particle assembly
    revealTime = performance.now() / 1000;

    const tl = gsap.timeline();

    // 1. Lift and Split "PORT" and "FOLIO"
    tl.to(titleWrapper, {
      y: liftY,
      duration: 1.35,
      ease: "power3.inOut"
    }, "+=0.05");

    tl.to(partLeft, {
      x: -gapX,
      duration: 1.35,
      ease: "power3.out"
    }, "<");

    tl.to(partRight, {
      x: gapX,
      duration: 1.35,
      ease: "power3.out"
    }, "<");

    // 2. Side Panel & Contact Dock fade in
    tl.to(sidePanel, {
      y: 0,
      opacity: 1,
      duration: 0.95,
      ease: "power3.out"
    }, "-=0.75");

    tl.to(contactDock, {
      y: 0,
      opacity: 1,
      duration: 0.95,
      ease: "power3.out"
    }, "-=0.85");

    // 3. Top Navigation fades in
    tl.to(topNav, {
      opacity: 1,
      duration: 0.8,
      ease: "power2.out"
    }, "-=0.65");
  }

  // TASK 3: CONTACT DOCK INTERACTIVITY (NEVER CUT OFF)
  function initContactDock() {
    let isOpen = false;

    contactToggleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      isOpen = !isOpen;
      contactDock.classList.toggle("open", isOpen);
      contactBtnText.textContent = isOpen ? "Close" : "Contact";
    });

    document.addEventListener("click", (e) => {
      if (isOpen && !contactDock.contains(e.target)) {
        isOpen = false;
        contactDock.classList.remove("open");
        contactBtnText.textContent = "Contact";
      }
    });

    // Tooltip pointer ripple position
    document.querySelectorAll(".contact-chip").forEach(chip => {
      chip.addEventListener("pointermove", (e) => {
        const b = chip.getBoundingClientRect();
        chip.style.setProperty("--fx", `${((e.clientX - b.left) / b.width * 100).toFixed(1)}%`);
        chip.style.setProperty("--fy", `${((e.clientY - b.top) / b.height * 100).toFixed(1)}%`);
      });

      chip.addEventListener("click", async (e) => {
        e.stopPropagation();
        const action = chip.dataset.action;
        if (action === "copy") {
          try {
            await navigator.clipboard.writeText(CONTACT_LINKS.copy);
            showToast("Portfolio Link Copied!");
          } catch (err) {
            showToast("Copied to Clipboard!");
          }
        } else if (action === "email") {
          window.location.href = CONTACT_LINKS.email;
        } else if (action === "cv") {
          window.open(CONTACT_LINKS.cv, "_blank");
        } else if (CONTACT_LINKS[action]) {
          window.open(CONTACT_LINKS[action], "_blank", "noopener");
        }
      });
    });
  }

  function showToast(msg) {
    toastNotice.textContent = msg;
    toastNotice.classList.add("show");
    setTimeout(() => {
      toastNotice.classList.remove("show");
    }, 2200);
  }

  // Orchestration Sequence
  function startSequence() {
    gsap.set(titleWrapper, { y: 0 });
    gsap.set(partLeft, { x: 0 });
    gsap.set(partRight, { x: 0 });
    gsap.set(mainHeroText, { opacity: 0 });
    gsap.set(initialLettersBox, { opacity: 1 });
    gsap.set(sidePanel, { opacity: 0, y: 20 });
    gsap.set(contactDock, { opacity: 0, y: 20 });
    gsap.set(topNav, { opacity: 0 });

    revealTime = null;

    playBounceAndWriteName(() => {
      setTimeout(() => {
        playMorphAnimation(() => {
          setTimeout(playSplitAndReveal, 60);
        });
      }, 100);
    });
  }

  // Boot
  initWebGL();
  initContactDock();
  requestAnimationFrame(renderFrame);

  loadAssets().then(() => {
    setTimeout(startSequence, 120);
  });

  // Replay
  replayBtn.addEventListener("click", () => {
    startSequence();
  });

})();
</script>
